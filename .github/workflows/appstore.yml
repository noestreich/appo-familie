name: App-Store-Screenshots (Familie)

# Wiederverwendbar: Bilder in voller Auflösung für App Store Connect.
#   iPhone 6,9" (Pro Max, 1320 × 2868)          → docs/appstore/raw/
#   iPhone Duo innen (aufgeklappt, 2853 × 2007)  → docs/appstore/raw-duo/
#   iPhone Duo außen (zugeklappt, 1398 × 2034)   → docs/appstore/raw-duo-aussen/
#   iPad 13 Zoll (2064 × 2752, falls angegeben)  → docs/appstore/raw-ipad/
#   Apple Watch (falls die App eine hat)         → docs/appstore/watch/
# Ersetzt wird nur, was dieser Lauf neu aufgenommen hat – ein fehlendes Watch-Bild löscht das alte nicht.
# Rahmen, Überschriften und Upload zu App Store Connect danach im Workflow appstore-upload.yml (zweiter Job der App).
# Erprobt in Schreibo, Oktober 2026 – die Gründe für jeden Schritt stehen in DESIGN.md („Rezept: Duo-Build …“).
#
# Szenen wie im Screenshots-Workflow: „<szene> <sekunden> <dateiname> [weitere Startargumente]“,
# „appearance dark|light“ schaltet um. Watch-Szenen: „<sekunden> <dateiname> [Startargumente nach -demo]“.
#
#   jobs:
#     appstore:
#       uses: noestreich/appo-familie/.github/workflows/appstore.yml@v1
#       permissions:
#         contents: write
#       with:
#         project: Schreibo.xcodeproj
#         scheme: Schreibo
#         app-name: Schreibo
#         bundle-id: de.ncls.schreibo
#         iphone-scenes: |
#           today 10 01-heute
#         duo-inner-scenes: |
#           today 10 01-doppelseite
#         duo-outer-scenes: |
#           today 10 01-aussen
#         ipad-scenes: |
#           today 10 01-ipad
#         watch-app: SchreiboWatch
#         watch-bundle-id: de.ncls.schreibo.watchkitapp
#         watch-scenes: |
#           10 watch-1-heute
#       secrets: inherit
on:
  workflow_call:
    inputs:
      project:
        type: string
        required: true
      scheme:
        type: string
        required: true
      app-name:
        description: Name der .app im Build-Ordner (ohne .app)
        type: string
        required: true
      bundle-id:
        type: string
        required: true
      iphone-scenes:
        type: string
        required: true
      duo-inner-scenes:
        description: Szenen fürs innere Display (aufgeklappt quer, 2853 × 2007); leer = keine
        type: string
        default: ""
      duo-outer-scenes:
        description: Szenen fürs Außendisplay (zugeklappt, 1398 × 2034); leer = keine
        type: string
        default: ""
      ipad-scenes:
        description: Szenen fürs iPad mit 13 Zoll (hochkant, 2064 × 2752); leer = keine. Die App braucht dafür TARGETED_DEVICE_FAMILY "1,2"
        type: string
        default: ""
      ipad-types:
        description: Gerätetypen fürs iPad zuerst probieren; danach das neueste iPad Pro mit 13 Zoll
        type: string
        default: ""
      watch-app:
        description: Name der Watch-.app im Build-Ordner (ohne .app); leer = keine Watch
        type: string
        default: ""
      watch-bundle-id:
        type: string
        default: ""
      watch-scenes:
        type: string
        default: ""
      warmup-scene:
        description: Szene für den ersten Start, nach dem gewartet wird (Systemmitteilungen)
        type: string
        default: today
      warmup-seconds:
        description: Wartezeit nach dem ersten Start in Sekunden (Systemmitteilungen, Beispieldaten anlegen)
        type: string
        default: "60"
      app-files:
        description: >-
          Dateien aus dem Repo, die nach dem Installieren in den Datencontainer der App kommen, eine Zeile pro Datei:
          „<pfad im repo> <pfad im container>“, z. B. „docs/testdata/zettel.jpg Documents/demo-note.jpg“
        type: string
        default: ""
      iphone-types:
        description: Gerätetypen in dieser Reihenfolge probieren (Fach 6,9")
        type: string
        default: iPhone-18-Pro-Max iPhone-17-Pro-Max
      location:
        description: Simulierter Standort (Breite,Länge); leer = keiner
        type: string
        default: "52.4990,13.4030"
      output-root:
        type: string
        default: docs/appstore
    secrets:
      FAMILIE_TOKEN:
        required: false

jobs:
  appstore:
    name: App-Store-Bilder
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      BUNDLE: ${{ inputs.bundle-id }}
      LOCATION: ${{ inputs.location }}
      WARMUP: ${{ inputs.warmup-scene }}
      WARMUP_SECONDS: ${{ inputs.warmup-seconds }}
      FILES: ${{ inputs.app-files }}
    steps:
      - uses: actions/checkout@v4
      - name: Zugriff auf appo-familie (nur wenn privat)
        env:
          TOKEN: ${{ secrets.FAMILIE_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            git config --global url."https://x-access-token:${TOKEN}@github.com/noestreich/appo-familie".insteadOf "https://github.com/noestreich/appo-familie"
          fi
      - name: XcodeGen
        run: brew install xcodegen && xcodegen generate

      - name: iPhone Pro Max anlegen und starten
        env:
          TYPES: ${{ inputs.iphone-types }}
        run: |
          # Kein Simulator im Image; nur eine echte UUID zählt (simctl schreibt Fehler auf stdout).
          # Normale iPhones laufen auf der vorinstallierten 27.0-Laufzeit, gebaut wird mit dem 27.1-SDK.
          UDID=""
          for rt in $(xcrun simctl list runtimes -j | python3 -c "import json,sys; print(' '.join(r['identifier'] for r in reversed(json.load(sys.stdin)['runtimes']) if r['platform']=='iOS' and r['isAvailable']))"); do
            for t in $TYPES; do
              out=$(xcrun simctl create "Familie Pro Max" "com.apple.CoreSimulator.SimDeviceType.$t" "$rt" 2>&1) || continue
              if echo "$out" | grep -qE '^[0-9A-F-]{36}$'; then UDID="$out"; echo "$t auf $rt"; break 2; fi
            done
          done
          test -n "$UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl spawn "$UDID" defaults write com.apple.Preferences DidShowContinuousPathIntroduction -bool true
          xcrun simctl spawn "$UDID" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool true
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 --operatorName ""
          if [ -n "$LOCATION" ]; then xcrun simctl location "$UDID" set "$LOCATION" || true; fi

      - name: Bauen
        run: |
          set -o pipefail
          xcodebuild build -project "${{ inputs.project }}" -scheme "${{ inputs.scheme }}" \
            -destination "id=$UDID" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO | tail -5
          echo "APP=build/Build/Products/Debug-iphonesimulator/${{ inputs.app-name }}.app" >> "$GITHUB_ENV"

      - name: iPhone-Bilder
        env:
          SCENES: ${{ inputs.iphone-scenes }}
        run: |
          # Dateien in den Datencontainer der App legen (Angabe app-files)
          put_files() {
            [ -n "$FILES" ] || return 0
            data=$(xcrun simctl get_app_container "$1" "$BUNDLE" data)
            while read -r src dst <&3; do
              case "$src" in ""|\#*) continue;; esac
              mkdir -p "$data/$(dirname "$dst")"
              cp "$src" "$data/$dst"
            done 3<<< "$FILES"
          }
          mkdir -p shots
          xcrun simctl install "$UDID" "$APP"
          put_files "$UDID"
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl launch "$UDID" "$BUNDLE" -demo -demoScene "$WARMUP"
          sleep "$WARMUP_SECONDS"
          while read -r scene secs name rest <&3; do
            case "$scene" in ""|\#*) continue;; esac
            if [ "$scene" = appearance ]; then xcrun simctl ui "$UDID" appearance "$secs"; continue; fi
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            # shellcheck disable=SC2086
            xcrun simctl launch "$UDID" "$BUNDLE" -demo -demoScene "$scene" $rest < /dev/null
            sleep "$secs"
            xcrun simctl io "$UDID" screenshot "shots/$name.png" < /dev/null
          done 3<<< "$SCENES"
          sips -g pixelWidth -g pixelHeight shots/*.png | head -3
          xcrun simctl shutdown "$UDID" || true

      - name: iPhone-Duo-Bilder
        if: inputs.duo-outer-scenes != '' || inputs.duo-inner-scenes != ''
        env:
          OUTER: ${{ inputs.duo-outer-scenes }}
          INNER: ${{ inputs.duo-inner-scenes }}
        run: |
          # Dateien in den Datencontainer der App legen (Angabe app-files)
          put_files() {
            [ -n "$FILES" ] || return 0
            data=$(xcrun simctl get_app_container "$1" "$BUNDLE" data)
            while read -r src dst <&3; do
              case "$src" in ""|\#*) continue;; esac
              mkdir -p "$data/$(dirname "$dst")"
              cp "$src" "$data/$dst"
            done 3<<< "$FILES"
          }
          xcodebuild -downloadPlatform iOS 2>&1 | grep -v "%" | tail -3
          brew install artemnovichkov/tap/hinge
          DUO=$(xcrun simctl create "Familie Duo" com.apple.CoreSimulator.SimDeviceType.iPhone-Duo com.apple.CoreSimulator.SimRuntime.iOS-27-1)
          xcrun simctl boot "$DUO"
          xcrun simctl bootstatus "$DUO" -b || true
          xcrun simctl spawn "$DUO" defaults write com.apple.Preferences DidShowContinuousPathIntroduction -bool true
          xcrun simctl spawn "$DUO" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool true
          xcrun simctl status_bar "$DUO" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 --operatorName "" || true
          if [ -n "$LOCATION" ]; then xcrun simctl location "$DUO" set "$LOCATION" || true; fi
          xcrun simctl install "$DUO" "$APP"
          put_files "$DUO"

          # Display an der Breite erkennen: außen 1398, innen 2853 (quer) bzw. 2007.
          # Das zuletzt passende Display zuerst probieren: Ein Foto vom gerade abgeschalteten Display kann
          # Minuten hängen, bevor es scheitert (Schreibo: über drei Minuten je Szene ohne diesen Merker).
          LAST_DISPLAY=""
          display_shot() {
            for id in $LAST_DISPLAY $(xcrun simctl io "$DUO" enumerate | awk '/UUID:/{u=$2} /Class: Display/{print u}'); do
              xcrun simctl io "$DUO" screenshot --display="$id" pick.png >/dev/null 2>&1 || continue
              w=$(sips -g pixelWidth pick.png | awk '/pixelWidth/{print $2}')
              case " $2 " in *" $w "*) mv pick.png "$1"; LAST_DISPLAY="$id"; return 0;; esac
            done
            echo "Kein Display mit Breite $2 für $1"
            return 1
          }
          # Klappen: „close“ bzw. „open“ (hinge 0.1; „closed“ zeigt nur die Hilfe). Scheitert es, bricht der Schritt ab,
          # statt Bilder in der falschen Haltung aufzunehmen.
          fold() {
            if ! hinge -d "$DUO" "$1"; then echo "::error::hinge $1 hat nicht geklappt"; return 1; fi
            LAST_DISPLAY=""
            sleep 5
            echo "Klappwinkel nach $1: $(hinge -d "$DUO" get 2>&1)"
          }
          duo_scenes() {   # $1 Szenenliste, $2 Zielordner, $3 erlaubte Breiten
            mkdir -p "$2"
            while read -r scene secs name rest <&3; do
              case "$scene" in ""|\#*) continue;; esac
              if [ "$scene" = appearance ]; then xcrun simctl ui "$DUO" appearance "$secs"; continue; fi
              xcrun simctl terminate "$DUO" "$BUNDLE" 2>/dev/null || true
              # shellcheck disable=SC2086
              xcrun simctl launch "$DUO" "$BUNDLE" -demo -demoScene "$scene" $rest < /dev/null
              sleep "$secs"
              display_shot "$2/$name.png" "$3" < /dev/null || echo "::warning::$name nicht aufgenommen"
            done 3<<< "$1"
          }

          xcrun simctl ui "$DUO" appearance light
          xcrun simctl launch "$DUO" "$BUNDLE" -demo -demoScene "$WARMUP"
          sleep "$WARMUP_SECONDS"
          if [ -n "$OUTER" ]; then
            fold close
            duo_scenes "$OUTER" duoouter "1398"
          fi
          if [ -n "$INNER" ]; then
            xcrun simctl ui "$DUO" appearance light
            fold open
            duo_scenes "$INNER" duoshots "2853 2007"
          fi
          xcrun simctl shutdown "$DUO" || true

      - name: iPad-Bilder
        if: inputs.ipad-scenes != ''
        env:
          SCENES: ${{ inputs.ipad-scenes }}
          TYPES: ${{ inputs.ipad-types }}
        run: |
          # Dateien in den Datencontainer der App legen (Angabe app-files)
          put_files() {
            [ -n "$FILES" ] || return 0
            data=$(xcrun simctl get_app_container "$1" "$BUNDLE" data)
            while read -r src dst <&3; do
              case "$src" in ""|\#*) continue;; esac
              mkdir -p "$data/$(dirname "$dst")"
              cp "$src" "$data/$dst"
            done 3<<< "$FILES"
          }
          # Gerätetyp: zuerst die Angabe ipad-types, dann das neueste iPad Pro mit 13 Zoll, das Xcode kennt
          # (2064 × 2752, Fach „iPad 13 Zoll“ in App Store Connect). Läuft auf der vorinstallierten Laufzeit.
          KNOWN=$(xcrun simctl list devicetypes -j | python3 -c "
          import json, sys
          types = [t for t in json.load(sys.stdin)['devicetypes'] if t['name'].startswith('iPad Pro') and '13' in t['name']]
          print(' '.join(t['identifier'] for t in reversed(types)))")
          IPAD=""
          for rt in $(xcrun simctl list runtimes -j | python3 -c "import json,sys; print(' '.join(r['identifier'] for r in reversed(json.load(sys.stdin)['runtimes']) if r['platform']=='iOS' and r['isAvailable']))"); do
            for t in $(for name in $TYPES; do echo "com.apple.CoreSimulator.SimDeviceType.$name"; done) $KNOWN; do
              out=$(xcrun simctl create "Familie iPad" "$t" "$rt" 2>&1) || continue
              if echo "$out" | grep -qE '^[0-9A-F-]{36}$'; then IPAD="$out"; echo "$t auf $rt"; break 2; fi
            done
          done
          if [ -z "$IPAD" ]; then echo "::error::Kein iPad mit 13 Zoll anlegbar (Gerätetypen: $TYPES $KNOWN)"; exit 1; fi
          xcrun simctl boot "$IPAD"
          xcrun simctl bootstatus "$IPAD" -b
          xcrun simctl spawn "$IPAD" defaults write com.apple.Preferences DidShowContinuousPathIntroduction -bool true
          xcrun simctl spawn "$IPAD" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool true
          xcrun simctl status_bar "$IPAD" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 || true
          if [ -n "$LOCATION" ]; then xcrun simctl location "$IPAD" set "$LOCATION" || true; fi
          xcrun simctl install "$IPAD" "$APP"
          put_files "$IPAD"
          xcrun simctl ui "$IPAD" appearance light
          xcrun simctl launch "$IPAD" "$BUNDLE" -demo -demoScene "$WARMUP"
          sleep "$WARMUP_SECONDS"
          mkdir -p ipadshots
          while read -r scene secs name rest <&3; do
            case "$scene" in ""|\#*) continue;; esac
            if [ "$scene" = appearance ]; then xcrun simctl ui "$IPAD" appearance "$secs"; continue; fi
            xcrun simctl terminate "$IPAD" "$BUNDLE" 2>/dev/null || true
            # shellcheck disable=SC2086
            xcrun simctl launch "$IPAD" "$BUNDLE" -demo -demoScene "$scene" $rest < /dev/null
            sleep "$secs"
            xcrun simctl io "$IPAD" screenshot "ipadshots/$name.png" < /dev/null
          done 3<<< "$SCENES"
          sips -g pixelWidth -g pixelHeight ipadshots/*.png | head -3
          xcrun simctl shutdown "$IPAD" || true

      - name: Apple-Watch-Bilder
        if: inputs.watch-app != ''
        # Ein fehlendes Watch-Bild soll die iPhone- und Duo-Bilder nicht aufhalten.
        continue-on-error: true
        env:
          WATCH_APP: ${{ inputs.watch-app }}
          WATCH_BUNDLE: ${{ inputs.watch-bundle-id }}
          SCENES: ${{ inputs.watch-scenes }}
        run: |
          mkdir -p watchshots
          # Die watchOS-Laufzeit zu Xcode 27.1 nachladen (rund 20 Minuten, wenn sie nicht schon im Image liegt)
          xcodebuild -downloadPlatform watchOS 2>&1 | grep -v "%" | tail -15 || true
          # Schreibo (18. Oktober) und Kaufo (19. Oktober), zwei Fehler:
          # 1. Der alte Filter mit r['platform'] und r['isAvailable'] fand die Laufzeit nicht, mit .get sofort.
          # 2. Auf manchen Runnern ist watchOS 27.0 eingetragen (oft sogar „verfügbar“), aber ohne Abbild:
          #    simctl create meldet „runtime path not found“, und -downloadPlatform hält sie für installiert.
          #    Dann den Eintrag löschen, die Laufzeit neu laden (rund 20 Minuten) und noch einmal anlegen.
          watch_runtimes() {   # $1 = all: auch nicht verfügbare
            xcrun simctl list runtimes -j | python3 -c "
          import json, sys
          runtimes = json.load(sys.stdin).get('runtimes', [])
          ids = [r.get('identifier', '') for r in runtimes
                 if (r.get('platform') == 'watchOS' or 'watchOS' in r.get('identifier', ''))
                 and (r.get('isAvailable') or sys.argv[1:] == ['all'])]
          print(' '.join(reversed(ids)))" "$@"
          }
          wait_watch() {   # $1 = Anzahl Versuche im Abstand von fünf Sekunden; danach auch nicht verfügbare
            RUNTIMES=""
            for _ in $(seq "$1"); do
              RUNTIMES=$(watch_runtimes)
              [ -n "$RUNTIMES" ] && break
              sleep 5
            done
            [ -n "$RUNTIMES" ] || RUNTIMES=$(watch_runtimes all)
            echo "Watch-Laufzeiten: ${RUNTIMES:-keine}"
          }
          TYPES=$(xcrun simctl list devicetypes -j | python3 -c "
          import json, sys
          types = [t for t in json.load(sys.stdin)['devicetypes'] if 'Watch' in t['name']]
          order = sorted(range(len(types)), key=lambda i: ('Ultra' not in types[i]['name'], -i))
          print(' '.join(types[i]['identifier'] for i in order))")
          create_watch() {
            WATCH=""
            last=""
            for rt in $RUNTIMES; do
              for t in $TYPES; do
                out=$(xcrun simctl create "Familie Watch" "$t" "$rt" 2>&1) || { last="$t auf $rt: $out"; continue; }
                if echo "$out" | grep -qE '^[0-9A-F-]{36}$'; then WATCH="$out"; echo "$t auf $rt"; return 0; fi
              done
            done
            echo "Keine Watch anlegbar – zuletzt: ${last:-keine Laufzeit oder kein Gerätetyp gefunden}"
            return 1
          }
          wait_watch 12
          if ! create_watch; then
            echo "Watch-Laufzeit löschen und neu laden:"
            xcrun simctl runtime list 2>&1 | grep -i -A3 watch || true
            for id in $(xcrun simctl runtime list -j | python3 -c "
          import json, sys
          entries = json.load(sys.stdin)
          items = entries.items() if isinstance(entries, dict) else [(e.get('identifier', ''), e) for e in entries]
          print(' '.join(key for key, value in items if key and 'watch' in json.dumps(value).lower()))"); do
              xcrun simctl runtime delete "$id" || true
            done
            xcodebuild -downloadPlatform watchOS 2>&1 | grep -v "%" | tail -5 || true
            wait_watch 60
            create_watch || { echo "Gerätetypen: $TYPES"; exit 1; }
          fi
          xcrun simctl boot "$WATCH"
          xcrun simctl bootstatus "$WATCH" -b
          xcrun simctl install "$WATCH" "build/Build/Products/Debug-watchsimulator/$WATCH_APP.app"
          xcrun simctl launch "$WATCH" "$WATCH_BUNDLE" -demo
          sleep 45
          # Kaufo, 19. Oktober: Das Foto brach einmal nach 60 Sekunden mit „Timeout waiting for screen surfaces“ ab.
          # Deshalb bis zu drei Versuche, dazwischen die App neu starten; ein fehlendes Bild hält die anderen nicht auf.
          while read -r secs name rest <&3; do
            case "$secs" in ""|\#*) continue;; esac
            for attempt in 1 2 3; do
              xcrun simctl terminate "$WATCH" "$WATCH_BUNDLE" 2>/dev/null || true
              # shellcheck disable=SC2086
              xcrun simctl launch "$WATCH" "$WATCH_BUNDLE" -demo $rest < /dev/null
              sleep "$secs"
              if xcrun simctl io "$WATCH" screenshot "watchshots/$name.png" < /dev/null; then break; fi
              echo "::warning::Watch-Bild $name, Versuch $attempt nicht aufgenommen"
            done
          done 3<<< "$SCENES"
          ls watchshots/*.png >/dev/null 2>&1

      - name: Auf schwarze Bilder prüfen
        if: always()
        run: |
          for f in shots/*.png duoshots/*.png duoouter/*.png ipadshots/*.png; do
            [ -f "$f" ] || continue
            size=$(stat -f %z "$f")
            if [ "$size" -lt 60000 ]; then echo "::warning::$f ist verdächtig klein ($size Bytes) – schwarzes Bild?"; fi
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appstore
          path: |
            shots
            duoshots
            duoouter
            ipadshots
            watchshots

      - name: Ins Repo
        env:
          ROOT: ${{ inputs.output-root }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"
          replace() {
            if ls "$1"/*.png >/dev/null 2>&1; then rm -rf "$2"; mkdir -p "$2"; cp "$1"/*.png "$2"/; git add -A "$2"; fi
          }
          replace shots "$ROOT/raw"
          replace duoshots "$ROOT/raw-duo"
          replace duoouter "$ROOT/raw-duo-aussen"
          replace ipadshots "$ROOT/raw-ipad"
          replace watchshots "$ROOT/watch"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "App-Store-Screenshots aktualisiert [skip ci]"
          # Läuft gleichzeitig ein anderer Bild-Workflow, ist main inzwischen weiter: neu aufsetzen und noch mal.
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push origin HEAD:"$GITHUB_REF_NAME" && exit 0
            sleep 10
          done
          exit 1
