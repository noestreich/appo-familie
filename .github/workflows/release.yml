name: Veröffentlichen (Familie)

# Wiederverwendbar: App für den App Store archivieren, signieren und zu App Store Connect hochladen.
# Danach steht der Build nach einigen Minuten in TestFlight; eingereicht wird weiter von Hand.
# Signiert wird automatisch über den API-Schlüssel (Zertifikate und Profile legt Xcode selbst an),
# Version und Build kommen aus project.yml (MARKETING_VERSION, CURRENT_PROJECT_VERSION).
# Nur per Hand starten (Actions → Veröffentlichen → Run workflow). Ein Lauf kostet 10–20 Minuten.
#   jobs:
#     release:
#       uses: noestreich/appo-familie/.github/workflows/release.yml@v1
#       with:
#         project: Kaufo.xcodeproj
#         scheme: Kaufo
#       secrets: inherit
on:
  workflow_call:
    inputs:
      project:
        description: Xcode-Projekt, wie es xcodegen erzeugt (z. B. Kaufo.xcodeproj)
        type: string
        required: true
      scheme:
        type: string
        required: true
      team-id:
        description: Apple-Team; leer = DEVELOPMENT_TEAM aus dem Projekt
        type: string
        default: ""
    secrets:
      ASC_KEY_ID:
        description: Key-ID des App-Store-Connect-API-Schlüssels
        required: true
      ASC_ISSUER_ID:
        description: Issuer-ID aus App Store Connect (Benutzer und Zugriff → Integrationen)
        required: true
      ASC_KEY_P8:
        description: Inhalt der .p8-Datei des Schlüssels
        required: true
      FAMILIE_TOKEN:
        description: Nur nötig, solange appo-familie privat ist und die App das Swift-Paket per URL lädt
        required: false

jobs:
  release:
    name: Archivieren und hochladen
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Zugriff auf appo-familie (nur wenn privat)
        env:
          TOKEN: ${{ secrets.FAMILIE_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            git config --global url."https://x-access-token:${TOKEN}@github.com/noestreich/appo-familie".insteadOf "https://github.com/noestreich/appo-familie"
          fi
      - name: XcodeGen
        run: brew install xcodegen && xcodegen generate
      - name: API-Schlüssel ablegen
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey_${KEY_ID}.p8"
          printf '%s\n' "$KEY_P8" > "$key"
          chmod 600 "$key"
          grep -q "BEGIN PRIVATE KEY" "$key" || { echo "::error::ASC_KEY_P8 enthält keinen privaten Schlüssel (ganze .p8-Datei eintragen)"; exit 1; }
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"
      - name: Version und Team
        env:
          TEAM: ${{ inputs.team-id }}
        run: |
          xcodebuild -showBuildSettings -project "${{ inputs.project }}" -scheme "${{ inputs.scheme }}" -configuration Release 2>/dev/null > settings.txt
          value() { awk -v key="$1" '$1 == key && $2 == "=" { print $3; exit }' settings.txt; }
          version=$(value MARKETING_VERSION)
          build=$(value CURRENT_PROJECT_VERSION)
          [ -n "$TEAM" ] || TEAM=$(value DEVELOPMENT_TEAM)
          [ -n "$TEAM" ] || { echo "::error::Kein Team: DEVELOPMENT_TEAM in project.yml oder team-id angeben"; exit 1; }
          echo "Version $version ($build), Team $TEAM"
          { echo "APP_VERSION=$version"; echo "APP_BUILD=$build"; echo "TEAM_ID=$TEAM"; } >> "$GITHUB_ENV"
      - name: Archivieren
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "${{ inputs.project }}" \
            -scheme "${{ inputs.scheme }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log
      - name: Hochladen zu App Store Connect
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            | tee export.log | grep -E "error:|Upload|EXPORT (SUCCEEDED|FAILED)" || true
          grep -q "EXPORT SUCCEEDED" export.log
          echo "### ${{ inputs.scheme }} $APP_VERSION ($APP_BUILD) hochgeladen" >> "$GITHUB_STEP_SUMMARY"
          echo "Nach der Verarbeitung durch Apple (meist 5–30 Minuten) steht der Build in TestFlight." >> "$GITHUB_STEP_SUMMARY"
      - name: Fehler anzeigen
        if: failure()
        run: |
          for log in archive.log export.log; do
            [ -f "$log" ] || continue
            echo "::group::$log (Signieren, Fehler, letzte Zeilen)"
            grep -iE "error|signing|provision|certificate|profile|not permitted|forbidden|unauthorized" "$log" | grep -v "^ *export " | sort -u | head -60 || true
            echo "…"
            tail -40 "$log"
            echo "::endgroup::"
          done
      - name: Schlüssel entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
