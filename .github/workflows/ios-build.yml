name: iOS-Build (Familie)

# Wiederverwendbar: App mit Xcode 27.1 (iOS-27.1-SDK, nötig fürs iPhone Duo) für den Simulator bauen,
# gebaute Produkte, Warnungen im eigenen Code und das Auslesen der App-Intents-Metadaten auflisten.
# Ziel der App bleibt ihre Sache (iOS 26).
#   jobs:
#     ios-build:
#       uses: noestreich/appo-familie/.github/workflows/ios-build.yml@v1
#       with:
#         project: Schreibo.xcodeproj
#         scheme: Schreibo
#         product-prefix: Schreibo
#       secrets: inherit
on:
  workflow_call:
    inputs:
      project:
        description: Xcode-Projekt, wie es xcodegen erzeugt (z. B. Schreibo.xcodeproj)
        type: string
        required: true
      scheme:
        type: string
        required: true
      product-prefix:
        description: Anfang der Produktnamen für die Liste (z. B. Schreibo → Schreibo.app, SchreiboWidget.appex)
        type: string
        required: true
    secrets:
      FAMILIE_TOKEN:
        description: Nur nötig, solange appo-familie privat ist und die App das Swift-Paket per URL lädt (Lesezugriff auf appo-familie)
        required: false

jobs:
  build:
    name: iOS Build
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Zugriff auf appo-familie (nur wenn privat)
        env:
          TOKEN: ${{ secrets.FAMILIE_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            git config --global url."https://x-access-token:${TOKEN}@github.com/noestreich/appo-familie".insteadOf "https://github.com/noestreich/appo-familie"
          fi
      - name: Xcode-Version
        run: xcodebuild -version
      - name: XcodeGen
        run: brew install xcodegen && xcodegen generate
      - name: Bauen (Simulator, ohne Signatur)
        run: |
          set -o pipefail
          xcodebuild build \
            -project "${{ inputs.project }}" \
            -scheme "${{ inputs.scheme }}" \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Gebaute Produkte und Warnungen
        env:
          PREFIX: ${{ inputs.product-prefix }}
        run: |
          echo "Produkte:"; grep -oE "${PREFIX}[A-Za-z]*\.(app|appex)" build.log | sort -u || true
          echo "Warnungen im eigenen Code:"; grep -E "^/.*warning:" build.log | grep -v "/SourcePackages/" | sort -u | head -60 || true
          # Fehlen die Metadaten, laufen Intents in Widgets nicht (Knöpfe öffnen nur die App, konfigurierbare Widgets bleiben leer).
          echo "App-Intents-Metadaten übersprungen in:"
          awk '/^ExtractAppIntentsMetadata \(in target/ { target = $0 } /Metadata extraction skipped/ { print "  " target }' build.log | sort -u || true
      - name: App Intents in den gebauten Produkten
        # Welche Intents und Entitäten iOS je App und Erweiterung findet. Fehlt hier etwas, ruft iOS es nie auf.
        run: |
          grep -E "appintentsmetadataprocessor.*(warning|error):" build.log | sed -E 's/^[0-9-]+ [0-9:.]+ //' | sort -u | head -20 || true
          find ~/Library/Developer/Xcode/DerivedData -path "*/Build/Products/*" -name extract.actionsdata 2>/dev/null | sort | while read -r meta; do
            echo "${meta#*/Build/Products/}"
            python3 - "$meta" <<'PY' || true
          import json, sys
          data = json.load(open(sys.argv[1]))
          def names(key):
              value = data.get(key) or {}
              return sorted(value.keys()) if isinstance(value, dict) else sorted(str(v.get("identifier", v)) for v in value)
          for key in ("actions", "entities", "queries", "enums"):
              print(f"  {key}: {', '.join(names(key)) or '–'}")
          PY
          done
      - name: Fehler anzeigen
        if: failure()
        run: grep -E "error:" -A3 build.log | head -200 || true
